<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Planner - 智能周末旅行管家</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #ffffff;
        }

        /* === 左侧边栏 (会话列表) === */
        .sidebar {
            width: 260px;
            background-color: #202123;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 10px;
            flex-shrink: 0;
        }

        .new-chat-btn {
            border: 1px solid #4d4d4f;
            background: transparent;
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2A2B32;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .session-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ececf1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-item:hover {
            background-color: #2A2B32;
        }

        .session-item.active {
            background-color: #343541;
            font-weight: 500;
        }

        /* 滚动条美化 */
        .session-list::-webkit-scrollbar {
            width: 6px;
        }

        .session-list::-webkit-scrollbar-thumb {
            background: #4d4d4f;
            border-radius: 3px;
        }

        /* === 右侧主聊天区 === */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #ffffff;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 24px 20px;
            border-bottom: 1px solid transparent;
        }

        .message-row.bot {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            background-color: #f7f7f8;
        }

        .message-inner {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 20px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            font-size: 14px;
        }

        .avatar.user {
            background-color: #10a37f;
        }

        .avatar.bot {
            background-color: #1a73e8;
        }

        .msg-content {
            line-height: 1.6;
            color: #374151;
            white-space: pre-wrap;
            font-size: 15px;
            flex: 1;
        }

        .msg-content img {
            max-width: 300px;
            border-radius: 6px;
            margin-top: 10px;
            display: block;
            border: 1px solid #eee;
        }

        /* === 底部输入区 === */
        .input-wrapper {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, #fff 30%);
            padding: 20px 20px 30px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .input-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            padding: 12px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: #10a37f;
        }

        .preview-container {
            display: none;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }

        .preview-container img {
            height: 60px;
            border-radius: 6px;
            border: 1px solid #ddd;
            object-fit: cover;
        }

        .remove-img-btn {
            position: absolute;
            top: -5px;
            left: 50px;
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .input-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 5px;
            color: #333;
        }

        input[type="file"] {
            display: none;
        }

        .upload-icon, .send-icon {
            cursor: pointer;
            color: #8e8ea0;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
        }

        .upload-icon:hover {
            background: #ececf1;
            color: #333;
        }

        /* 发送按钮激活状态 */
        .send-icon {
            background: transparent;
        }

        .send-icon.active {
            color: white;
            background: #10a37f;
            box-shadow: 0 2px 5px rgba(16, 163, 127, 0.3);
        }

        .send-icon.active:hover {
            background: #0e906f;
        }

        /* 加载动画 */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 20px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: #8e8ea0;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <button class="new-chat-btn" onclick="createNewSession()">
        <span>➕</span> 新建周末规划
    </button>
    <div class="session-list" id="sessionList">
        <div style="padding: 20px; text-align: center; color: #888; font-size: 12px;">加载会话中...</div>
    </div>
</aside>

<main class="main-content">
    <div class="chat-box" id="chatBox">
    </div>

    <div class="input-wrapper">
        <div class="input-container">
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="预览">
                <button class="remove-img-btn" onclick="removeImage()">×</button>
            </div>
            <div class="input-controls">
                <label class="upload-icon" title="上传参考图片（如景点截图）">
                    🖼️
                    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp"
                           onchange="previewImage(event)">
                </label>
                <input type="text" id="textInput" placeholder="告诉我想去哪里玩，或者输入对行程的修改意见..." onkeypress="handleEnter(event)"
                       oninput="toggleSendBtn()">
                <div class="send-icon" id="sendBtn" onclick="sendMessage()" title="发送消息">⬆️</div>
            </div>
        </div>
    </div>
</main>

<script>
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const imageInput = document.getElementById('imageInput');
    const previewContainer = document.getElementById('previewContainer');
    const sessionListEl = document.getElementById('sessionList');
    const sendBtn = document.getElementById('sendBtn');

    // 全局状态
    let sessions = [];
    let currentSessionId = null;
    let isWaitingForReply = false; // 防止重复发送

    // ==========================================
    // 1. 初始化与 API 拉取
    // ==========================================
    async function init() {
        await fetchSessions();
        if (sessions.length === 0) {
            await createNewSession();
        } else {
            // 默认加载最近活跃的一个会话
            loadSession(sessions[0].session_id || sessions[0].id);
        }
    }

    async function fetchSessions() {
        try {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            sessions = data.sessions || [];
            renderSessionList();
        } catch (e) {
            console.error("无法获取会话列表", e);
            sessionListEl.innerHTML = '<div style="color:red; padding:10px;">服务器连接失败</div>';
        }
    }

    // ==========================================
    // 2. 会话管理逻辑
    // ==========================================
    function renderSessionList() {
        sessionListEl.innerHTML = '';
        sessions.forEach(session => {
            const sId = session.session_id || session.id;
            const div = document.createElement('div');
            div.className = `session-item ${sId === currentSessionId ? 'active' : ''}`;
            div.innerHTML = `💬 <span>${session.title || '新旅行规划'}</span>`;
            div.onclick = () => loadSession(sId);
            sessionListEl.appendChild(div);
        });
    }

    async function createNewSession() {
        if (isWaitingForReply) return;
        try {
            const res = await fetch('/api/sessions', {method: 'POST'});
            const data = await res.json();

            // 将新会话插到列表头部
            sessions.unshift({id: data.id, title: data.title});
            loadSession(data.id);
        } catch (e) {
            console.error("创建会话失败", e);
        }
    }

    async function loadSession(id) {
        if (isWaitingForReply) return;
        currentSessionId = id;
        renderSessionList();

        chatBox.innerHTML = '<div style="margin-top:40px; color:#888;">正在加载历史记录...</div>';

        try {
            const res = await fetch(`/api/history/${id}`);
            const data = await res.json();

            chatBox.innerHTML = '';
            // 如果这个会话是空的（刚建的），显示欢迎语
            if (!data.messages || data.messages.length === 0) {
                appendMessage("你好！我是周末旅行管家。\n\n你可以告诉我你的目的地，或者发送一张你想去的风景照片，我来帮你呼叫各路专家排行程！", "bot");
            } else {
                data.messages.forEach(msg => appendMessage(msg.content, msg.role));
            }
            scrollToBottom();
        } catch (e) {
            chatBox.innerHTML = '<div style="margin-top:40px; color:red;">加载历史记录失败，请检查后端服务。</div>';
        }
    }

    // ==========================================
    // 3. UI 交互与消息展示
    // ==========================================
    function toggleSendBtn() {
        if ((textInput.value.trim() || imageInput.files.length > 0) && !isWaitingForReply) {
            sendBtn.classList.add('active');
        } else {
            sendBtn.classList.remove('active');
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('imagePreview').src = e.target.result;
                previewContainer.style.display = 'block';
                toggleSendBtn();
            }
            reader.readAsDataURL(file);
        }
    }

    function removeImage() {
        imageInput.value = '';
        previewContainer.style.display = 'none';
        toggleSendBtn();
    }

    function appendMessage(content, role, imgSrc = null) {
        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const inner = document.createElement('div');
        inner.className = 'message-inner';

        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.innerText = role === 'user' ? 'U' : 'AI';

        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg-content';
        msgDiv.innerText = content;

        // 如果用户发了图片，显示图片
        if (imgSrc) {
            if (content) msgDiv.appendChild(document.createElement('br'));
            const img = document.createElement('img');
            img.src = imgSrc;
            msgDiv.appendChild(img);
        }

        inner.appendChild(avatar);
        inner.appendChild(msgDiv);
        row.appendChild(inner);
        chatBox.appendChild(row);
        scrollToBottom();
    }

    function scrollToBottom() {
        chatBox.scrollTo({top: chatBox.scrollHeight, behavior: 'smooth'});
    }

    // ==========================================
    // 4. 发送请求核心逻辑
    // ==========================================
    async function sendMessage() {
        if (isWaitingForReply) return;

        const text = textInput.value.trim();
        const file = imageInput.files[0];

        if (!text && !file) return;

        isWaitingForReply = true;
        toggleSendBtn(); // 禁用按钮样式

        // 1. 判断是否需要更新侧边栏标题 (如果是这个新会话的第一句话)
        const currentSession = sessions.find(s => (s.session_id === currentSessionId || s.id === currentSessionId));
        if (currentSession && (currentSession.title === "新旅行规划" || !currentSession.title) && text) {
            currentSession.title = text.substring(0, 15) + (text.length > 15 ? "..." : "");
            renderSessionList(); // 乐观更新 UI
            // 注意：后端的 /api/chat 已经接管了 MySQL 的 title 更新逻辑，这里不需要额外发请求了
        }

        // 2. 立即将用户输入显示在聊天框
        let base64Img = null;
        if (file) base64Img = document.getElementById('imagePreview').src;
        appendMessage(text, 'user', base64Img);

        // 3. 清理输入框
        textInput.value = '';
        removeImage();

        // 4. 显示 AI 思考中的动画
        const loadingId = 'loading-' + Date.now();
        const loadingRow = document.createElement('div');
        loadingRow.className = `message-row bot`;
        loadingRow.id = loadingId;
        loadingRow.innerHTML = `
            <div class="message-inner">
                <div class="avatar bot">AI</div>
                <div class="msg-content" style="color: #888;">
                    Agent 专家组正在协调规划中
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            </div>
        `;
        chatBox.appendChild(loadingRow);
        scrollToBottom();

        // 5. 构造表单数据发送给后端 Graph
        const formData = new FormData();
        formData.append('session_id', currentSessionId);
        if (text) formData.append('message', text);
        if (file) formData.append('image', file);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            // 移除加载动画
            document.getElementById(loadingId).remove();

            // 显示 Agent 最终汇总结果
            appendMessage(data.reply, 'bot');

            // 为了保证两端时间一致，发送完毕后重新拉取一次左侧会话列表以刷新顺序
            fetchSessions();

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("❌ 发送失败，请检查后端运行状态。", 'bot');
        } finally {
            isWaitingForReply = false;
            textInput.focus();
            toggleSendBtn();
        }
    }

    // 页面加载完毕后执行
    window.onload = init;
</script>
</body>
</html>
